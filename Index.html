<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#396ac3">
  <meta name="description" content="PrimeTrust Company account access">

  <title>PrimeTrust Company — Account Access</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #396ac3;
      --blue-dark: #2f5ca9;
      --blue-light: #edf4ff;
      --background: #edf2f8;
      --dark: #1e2126;
      --text: #4d5b70;
      --muted: #7d8795;
      --border: #dce3ec;
      --white: #ffffff;
      --error-bg: #fff1f1;
      --error: #b42318;
      --success-bg: #ecfdf3;
      --success: #027a48;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--background);
      color: var(--dark);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 430px;
      gap: 70px;
      align-items: center;
    }

    /* BRAND */

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 42px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--blue);
      color: white;
      font-size: 21px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(57, 106, 195, .20);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .brand-name span {
      color: var(--blue);
    }

    /* HERO */

    .hero h1 {
      max-width: 650px;
      font-size: clamp(42px, 5vw, 68px);
      line-height: 1.02;
      letter-spacing: -3px;
      margin-bottom: 24px;
    }

    .hero h1 span {
      color: var(--blue);
    }

    .hero-description {
      max-width: 540px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 32px;
    }

    .feature {
      padding: 10px 14px;
      border-radius: 100px;
      background: rgba(255, 255, 255, .65);
      border: 1px solid rgba(57, 106, 195, .10);
      color: var(--text);
      font-size: 12px;
    }

    /* AUTH CARD */

    .auth-card {
      width: 100%;
      padding: 34px;
      background: rgba(255, 255, 255, .97);
      border: 1px solid rgba(30, 33, 38, .06);
      border-radius: 26px;
      box-shadow: 0 25px 70px rgba(42, 67, 101, .13);
    }

    .auth-card h2 {
      font-size: 27px;
      letter-spacing: -.8px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    /* TABS */

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      margin-bottom: 24px;
      background: var(--background);
      border-radius: 12px;
    }

    .tab {
      border: 0;
      background: transparent;
      padding: 11px;
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }

    .tab.active {
      background: white;
      color: var(--blue);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .06);
    }

    /* FORM */

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 650;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: #fafcff;
      color: var(--dark);
      font-size: 14px;
      transition: .2s;
    }

    .field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(57, 106, 195, .10);
    }

    /* BUTTON */

    .main-button {
      width: 100%;
      min-height: 50px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(57, 106, 195, .20);
      transition: .2s;
    }

    .main-button:hover {
      background: var(--blue-dark);
      transform: translateY(-1px);
    }

    .main-button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    /* MESSAGE */

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: var(--error-bg);
      color: var(--error);
    }

    .message.success {
      display: block;
      background: var(--success-bg);
      color: var(--success);
    }

    /* SIGNUP */

    .signup-field {
      display: none;
    }

    .forgot {
      text-align: right;
      margin-top: -6px;
      margin-bottom: 19px;
    }

    .forgot a {
      color: var(--blue);
      font-size: 12px;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    /* FOOTER */

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #929baa;
      font-size: 10px;
    }

    /* TABLET */

    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
        max-width: 500px;
        gap: 40px;
      }

      .hero {
        text-align: center;
      }

      .brand {
        justify-content: center;
        margin-bottom: 28px;
      }

      .hero-description {
        margin: auto;
      }

      .features {
        justify-content: center;
      }
    }

    /* MOBILE */

    @media (max-width: 480px) {
      .page {
        padding: 25px 15px;
      }

      .auth-card {
        padding: 24px 20px;
        border-radius: 21px;
      }

      .hero h1 {
        font-size: 42px;
        letter-spacing: -2px;
      }

      .hero-description {
        font-size: 15px;
      }

      .brand {
        margin-bottom: 24px;
      }

      .logo {
        width: 43px;
        height: 43px;
        border-radius: 12px;
      }
    }

    /* VERY SMALL PHONES */

    @media (max-width: 350px) {
      .page {
        padding: 20px 10px;
      }

      .auth-card {
        padding: 20px 16px;
      }

      .hero h1 {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="container">

      <!-- LEFT SIDE -->

      <section class="hero">

        <div class="brand">

          <!-- PT LOGO PLACEHOLDER -->
          <!-- Replace this with your actual logo later -->

          <div class="logo">
            PT
          </div>

          <div class="brand-name">
            PrimeTrust<span>Company</span>
          </div>

        </div>

        <h1>
          Manage your portfolio
          <span>with clarity.</span>
        </h1>

        <p class="hero-description">
          Access your account and manage your portfolio
          from a secure, responsive workspace.
        </p>

        <div class="features">

          <div class="feature">
            Portfolio Overview
          </div>

          <div class="feature">
            Account Activity
          </div>

          <div class="feature">
            Secure Authentication
          </div>

        </div>

      </section>


      <!-- AUTHENTICATION -->

      <section>

        <div class="auth-card">

          <h2 id="formTitle">
            Welcome back
          </h2>

          <p class="subtitle" id="formSubtitle">
            Sign in to continue to your account.
          </p>


          <!-- TABS -->

          <div class="tabs">

            <button
              class="tab active"
              id="loginTab"
              type="button"
            >
              Sign In
            </button>

            <button
              class="tab"
              id="signupTab"
              type="button"
            >
              Create Account
            </button>

          </div>


          <!-- MESSAGE -->

          <div
            class="message"
            id="message"
            role="alert"
          ></div>


          <!-- FULL NAME -->

          <div
            class="field signup-field"
            id="nameField"
          >

            <label for="name">
              Full name
            </label>

            <input
              type="text"
              id="name"
              placeholder="Your full name"
              autocomplete="name"
            >

          </div>


          <!-- EMAIL -->

          <div class="field">

            <label for="email">
              Email address
            </label>

            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              autocomplete="email"
              inputmode="email"
            >

          </div>


          <!-- PASSWORD -->

          <div class="field">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            >

          </div>


          <!-- FORGOT PASSWORD -->

          <div
            class="forgot"
            id="forgot"
          >

            <a href="#" id="forgotLink">
              Forgot password?
            </a>

          </div>


          <!-- SUBMIT -->

          <button
            class="main-button"
            id="mainButton"
            type="button"
          >
            Sign In
          </button>

        </div>


        <div class="footer">
          © 2026 PrimeTrust Company
        </div>

      </section>

    </div>

  </main>


  <!-- SUPABASE JAVASCRIPT LIBRARY -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =====================================
       SUPABASE PROJECT
       ===================================== */

    const SUPABASE_URL =
      "https://mcahhalxxqevckjvbvub.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_rCjae9XwJqd1pnMxoTD8dA_QJA8aBAE";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =====================================
       ELEMENTS
       ===================================== */

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const nameField =
      document.getElementById("nameField");

    const nameInput =
      document.getElementById("name");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const mainButton =
      document.getElementById("mainButton");

    const formTitle =
      document.getElementById("formTitle");

    const formSubtitle =
      document.getElementById("formSubtitle");

    const message =
      document.getElementById("message");

    const forgot =
      document.getElementById("forgot");

    const forgotLink =
      document.getElementById("forgotLink");


    let createAccountMode = false;


    /* =====================================
       MESSAGE
       ===================================== */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function hideMessage() {

      message.textContent = "";

      message.className = "message";

    }


    /* =====================================
       LOGIN MODE
       ===================================== */

    function showLogin() {

      createAccountMode = false;

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

      nameField.style.display = "none";

      forgot.style.display = "block";

      formTitle.textContent =
        "Welcome back";

      formSubtitle.textContent =
        "Sign in to continue to your account.";

      mainButton.textContent =
        "Sign In";

      passwordInput.autocomplete =
        "current-password";

      hideMessage();

    }


    /* =====================================
       CREATE ACCOUNT MODE
       ===================================== */

    function showSignup() {

      createAccountMode = true;

      signupTab.classList.add("active");
      loginTab.classList.remove("active");

      nameField.style.display = "block";

      forgot.style.display = "none";

      formTitle.textContent =
        "Create your account";

      formSubtitle.textContent =
        "Create your account to get started.";

      mainButton.textContent =
        "Create Account";

      passwordInput.autocomplete =
        "new-password";

      hideMessage();

    }


    loginTab.addEventListener(
      "click",
      showLogin
    );

    signupTab.addEventListener(
      "click",
      showSignup
    );


    /* =====================================
       SIGN IN / SIGN UP
       ===================================== */

    mainButton.addEventListener(
      "click",
      async function () {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        const name =
          nameInput.value.trim();


        if (!email || !password) {

          showMessage(
            "Please enter your email address and password.",
            "error"
          );

          return;

        }


        if (createAccountMode && !name) {

          showMessage(
            "Please enter your full name.",
            "error"
          );

          return;

        }


        mainButton.disabled = true;

        mainButton.textContent =
          createAccountMode
            ? "Creating account..."
            : "Signing in...";


        try {

          if (createAccountMode) {

            const { error } =
              await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                  data: {
                    full_name: name
                  },

                  emailRedirectTo:
                    "https://primetrustcompany.github.io/Investment/welcome.html"

                }

              });


            if (error) {
              throw error;
            }


            passwordInput.value = "";

            showMessage(
              "Your account has been created. Please check your email to confirm your address.",
              "success"
            );


          } else {

            const { error } =
              await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

              });


            if (error) {
              throw error;
            }


            window.location.href =
              "welcome.html";

          }


        } catch (error) {

          showMessage(
            error.message ||
            "Unable to complete the request. Please try again.",
            "error"
          );

        }


        mainButton.disabled = false;

        mainButton.textContent =
          createAccountMode
            ? "Create Account"
            : "Sign In";

      }
    );


    /* =====================================
       FORGOT PASSWORD
       ===================================== */

    forgotLink.addEventListener(
      "click",
      async function (event) {

        event.preventDefault();

        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "Enter your email address first, then select Forgot password.",
            "error"
          );

          return;

        }


        try {

          const { error } =
            await supabaseClient.auth.resetPasswordForEmail(
              email,
              {
                redirectTo:
                  "https://primetrustcompany.github.io/Investment/reset-password.html"
              }
            );


          if (error) {
            throw error;
          }


          showMessage(
            "If an account exists for this email, a password-reset link has been sent.",
            "success"
          );


        } catch (error) {

          showMessage(
            error.message ||
            "Unable to send the password-reset email.",
            "error"
          );

        }

      }
    );

  </script>

</body>
</html>
